[package]
name = "droothe-browser"
version = "0.1.0"
description = "Droothe Browser desktop application"
authors = ["Droothe"]
edition = "2021"

[lib]
name = "droothe_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["unstable"] }
url = "2"
